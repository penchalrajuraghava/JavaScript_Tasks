<!doctype html>
<html>
  <head>
    <title>Product Cards</title>

    <style>
      body {
        font-family: Arial;
        background: #f5f5f5;
        padding: 20px;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

      .card {
        width: 250px;
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .card img {
        width: 100px;
        height: 100px;
        object-fit: contain;
      }

      .price {
        color: green;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>🛒 Product List</h1>

    <div class="container" id="products"></div>

    <script>
      let api = "https://fakestoreapi.com/products";

      fetch(api)
        .then((response) => {
          return response.json();
        })

        .then((data) => {
          console.log(data);

          let productsDiv = document.getElementById("products");

          productsDiv.innerHTML = data
            .map((item) => {
              return `

            <div class="card">

              <img src="${item.image}">

              <h3>${item.title}</h3>

              <p class="price">₹ ${item.price}</p>

            </div>

          `;
            })
            .join("");
        })

        .catch((error) => {
          console.log("Error:", error);
        });
    </script>
  </body>
</html>
